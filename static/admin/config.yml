backend:
  name: git-gateway
  branch: master
publish_mode: editorial_workflow
media_folder: "static/img"
public_folder: "/img"
collections:
  - name: "post"
    label: "Post"
    folder: "content/posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
      - label: "Last Mod"
        name: "lastmod"
        widget: "datetime"
      - label: "Author"
        name: "author"
        widget: "string"
      - label: "Cover"
        name: "cover"
        widget: "image"
      - label: "Categories"
        name: "categories"
        widget: "list"
      - label: "Tags"
        name: "tags"
        widget: "list"
      - label: "Body"
        name: "body"
        widget: "markdown"
  - name: "learn"
    label: "Learn"
    folder: "content/learning"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Subtitle
        name: subtitle
        widget: string
        required: false
      - label: Date
        name: date
        widget: datetime
      - label: Last Modified
        name: lastmod
        widget: datetime
      - label: Draft
        name: draft
        widget: boolean
      - label: Authors
        name: authors
        widget: list
      - label: Description
        name: description
        widget: text
      - label: License
        name: license
        widget: string
      - label: Images
        name: images
        widget: list
      - label: Tags
        name: tags
        widget: list
      - label: Categories
        name: categories
        widget: list
      - label: Series
        name: series
        widget: list
      - label: Series Weight
        name: series_weight
        widget: number
      - label: Series Navigation
        name: seriesNavigation
        widget: boolean
      - label: Featured Image
        name: featuredImage
        widget: image
      - label: Featured Image Preview
        name: featuredImagePreview
        widget: image
      - label: Hidden from Home Page
        name: hiddenFromHomePage
        widget: boolean
      - label: Hidden from Search
        name: hiddenFromSearch
        widget: boolean
      - label: Twemoji
        name: twemoji
        widget: boolean
      - label: LightGallery
        name: lightgallery
        widget: boolean
      - label: Ruby
        name: ruby
        widget: boolean
      - label: Fraction
        name: fraction
        widget: boolean
      - label: FontAwesome
        name: fontawesome
        widget: boolean
      - label: Link to Markdown
        name: linkToMarkdown
        widget: boolean
      - label: Link to Source
        name: linkToSource
        widget: boolean
      - label: Link to Edit
        name: linkToEdit
        widget: boolean
      - label: Link to Report
        name: linkToReport
        widget: boolean
      - label: RSS Full Text
        name: rssFullText
        widget: boolean
      - label: Table of Contents
        name: toc
        widget: boolean
        collapsed: true
      - label: Code
        name: code
        widget: object
        collapsed: true
        fields:
          - label: Copy
            name: copy
            widget: boolean
      - label: Table
        name: table
        widget: object
        collapsed: true
        fields:
          - label: Sort
            name: sort
            widget: boolean
      - label: Math
        name: math
        widget: object
        collapsed: true
        fields:
          - label: Enable
            name: enable
            widget: boolean
      - label: Mapbox
        name: mapbox
        widget: object
        collapsed: true
        fields:
          - label: Access Token
            name: accessToken
            widget: string
      - label: Share
        name: share
        widget: object
        collapsed: true
        fields:
          - label: Enable
            name: enable
            widget: boolean
      - label: Comment
        name: comment
        widget: object
        collapsed: true
        fields:
          - label: Enable
            name: enable
            widget: boolean
      - label: Library
        name: library
        widget: object
        collapsed: true
        fields:
          - label: CSS
            name: css
            widget: string
          - label: JS
            name: js
            widget: string
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        fields:
          - label: Images
            name: images
            widget: list
      - label: Outdated Article Reminder
        name: outdatedArticleReminder
        widget: object
        collapsed: true
        fields:
          - label: Enable
            name: enable
            widget: boolean
      - label: Sponsor
        name: sponsor
        widget: object
        collapsed: true
        fields:
          - label: Enable
            name: enable
            widget: boolean
      - label: Related Articles
        name: related
        widget: object
        collapsed: true
        fields:
          - label: Enable
            name: enable
            widget: boolean
          - label: Count
            name: count
            widget: number
          - label: Related Articles
            name: relatedArticles
            widget: list
            summary: title
            fields:
              - label: Title
                name: title
                widget: relation
                collection: learn
                searchFields:
                  - title
                valueField: title
  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Organizer", name: "organizer", widget: "string" }
      - { label: "Website", name: "website", widget: "string" }
      - { label: "Registration Link", name: "registrationLink", widget: "string" }
      - { label: "Featured Image", name: "featuredImage", widget: "image" }
      - { label: "Hidden from Homepage", name: "hiddenFromHomepage", widget: "boolean" }
      - { label: "Hidden from Search", name: "hiddenFromSearch", widget: "boolean" }
  - name: "jobs"
    label: "Jobs"
    folder: "content/jobs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Type", name: "type", widget: "select", options: ["Full-time", "Part-time", "Contract", "One-time"] }
      - { label: "Compensation", name: "compensation", widget: "select", options: ["Unpaid/Volunteered", "Equity Only", "Salary", "Salary + Equity"] }
      - { label: "Salary Amount", name: "salaryAmount", widget: "number", required: false }
      - { label: "Salary Frequency", name: "salaryFrequency", widget: "select", options: ["Annual", "Monthly", "Daily", "Hourly"], required: false }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Company", name: "company", widget: "string" }
      - { label: "Company Website", name: "companyWebsite", widget: "string" }
      - { label: "Application Link", name: "applicationLink", widget: "string" }
      - { label: "Featured Image", name: "featuredImage", widget: "image" }
      - { label: "Hidden from Homepage", name: "hiddenFromHomepage", widget: "boolean" }
      - { label: "Hidden from Search", name: "hiddenFromSearch", widget: "boolean" }
  - name: "marketplace"
    label: "Marketplace"
    folder: "content/marketplace"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Software","Electronics", "Clothing", "Furniture", "Books", "Other"] }
      - { label: "Price", name: "price", widget: "number" }
      - { label: "Currency", name: "currency", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Contact Email", name: "contactEmail", widget: "string" }
      - { label: "Contact Phone", name: "contactPhone", widget: "string" }
      - { label: "Featured Image", name: "featuredImage", widget: "image" }
      - { label: "Hidden from Homepage", name: "hiddenFromHomepage", widget: "boolean" }
      - { label: "Hidden from Search", name: "hiddenFromSearch", widget: "boolean" }