{{ define "content" }}
<div class="auth-container">
    <div class="glass-panel">
        <h1 class="gradient-text">Welcome Back</h1>
        <p class="subtitle">Log in to access your dashboard.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="avatar_name">Username (Avatar Name)</label>
                <input type="text" id="avatar_name" name="avatar_name" required placeholder="CodeMaster99">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="pin">2FA Code (if enabled)</label>
                <input type="text" id="pin" name="pin" placeholder="123456" autocomplete="off" maxlength="6">
            </div>

            <div class="form-actions">
                <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="btn-text">Log In</span>
                <div class="loader" style="display:none;"></div>
            </button>
            <p id="form-message" class="message"></p>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/signup">Sign up</a></p>
            <p style="margin-top: 0.5rem; font-size: 0.9rem;"><a href="/activate">Activate Account</a></p>
        </div>
    </div>
</div>

<!-- Styles moved to tailwind.css -->

<script>
    const API_URL = "{{ if hugo.IsServer }}http://localhost:8080{{ else }}{{ .Site.Params.apiUrl }}{{ end }}";

    class AuthController extends BaseController {
        constructor(apiUrl) {
            super(apiUrl);
            this.form = document.getElementById('login-form');
            if (this.form) {
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
            }
        }

        async handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('form-message');
            const loader = btn.querySelector('.loader');
            const inputs = this.form.querySelectorAll('input');

            // Reset validation states
            inputs.forEach(input => input.classList.remove('input-error'));

            btn.disabled = true;
            if (loader) loader.style.display = 'block';
            msg.innerText = '';
            msg.className = 'message';

            try {
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // 🛡️ Encryption Check
                if (typeof CryptoUtils === 'undefined') {
                    throw new Error("Encryption library missing. Please refresh.");
                }

                const payload = {
                    avatar_name: data.avatar_name,
                    verification: {
                        "2fa_pin": data.pin,
                        encrypted_pass: await CryptoUtils.encrypt(data.password)
                    }
                };

                const res = await fetch(`${this.apiUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    let errMsg = await res.text();
                    try { errMsg = JSON.parse(errMsg).message || errMsg; } catch (_) { }
                    throw new Error(errMsg || 'Login failed');
                }

                msg.innerText = 'Login successful! Redirecting...';
                msg.classList.add('success');
                window.toaster.show('Login successful', 'success');

                // Redirect logic
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || '/dashboard';

                setTimeout(() => {
                    window.location.href = redirect;
                }, 1000);

            } catch (error) {
                // Apply visual shake animations on inputs
                const inputs = this.form.querySelectorAll('input');
                inputs.forEach(input => {
                    // Force reflow to restart animation if classes re-applied rapidly
                    input.classList.remove('input-error');
                    void input.offsetWidth;
                    input.classList.add('input-error');
                });

                msg.innerText = error.message;
                msg.classList.add('error');
                this.handleError(error, 'Login Failed');
            } finally {
                btn.disabled = false;
                if (loader) loader.style.display = 'none';
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const app = new AuthController(API_URL);
    });
</script>
{{ end }}
