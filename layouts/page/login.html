{{ define "content" }}
<div class="auth-container">
    <div class="glass-panel">
        <h1 class="gradient-text">Welcome Back</h1>
        <p class="subtitle">Log in to access your dashboard.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="avatar_name">Username (Avatar Name)</label>
                <input type="text" id="avatar_name" name="avatar_name" required placeholder="CodeMaster99">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-actions">
                <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="btn-text">Log In</span>
                <div class="loader" style="display:none;"></div>
            </button>
            <p id="form-message" class="message"></p>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/signup">Sign up</a></p>
        </div>
    </div>
</div>

<style>
    :root {
        --primary-color: #6366f1;
        --secondary-color: #a855f7;
        --bg-color: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-color: #f8fafc;
        --input-bg: rgba(0, 0, 0, 0.2);
    }

    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 2rem;
    }

    .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 3rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .gradient-text {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2.5rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 2rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #e2e8f0;
    }

    input {
        width: 100%;
        padding: 12px 16px;
        background: var(--input-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        color: var(--text-color);
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1.5rem;
    }

    .forgot-link {
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.9rem;
    }

    .forgot-link:hover {
        color: var(--primary-color);
    }

    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        color: #94a3b8;
    }

    .auth-footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
    }

    .message {
        text-align: center;
        margin-top: 1rem;
        font-weight: 600;
    }

    .success {
        color: #4ade80;
    }

    .error {
        color: #f87171;
    }

    .loader {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 3px solid #fff;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        margin-left: 10px;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<script>
    const API_URL = window.GO4U_API_URL;

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const msg = document.getElementById('form-message');
        const loader = btn.querySelector('.loader');

        btn.disabled = true;
        loader.style.display = 'block';
        msg.innerText = '';
        msg.className = 'message';

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries()); // avatar_name, email, password

        try {
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include', // Important for Cookies
                // Prepare ECIES Encrypted Nested JSON
                body: JSON.stringify({
                    avatar_name: data.avatar_name, // Typically not encrypted?
                    verification: {
                        encrypted_email: await CryptoUtils.encrypt(data.email),
                        encrypted_pass: await CryptoUtils.encrypt(data.password)
                    }
                })
            });

            if (response.ok) {
                msg.innerText = 'Login successful! Redirecting...';
                msg.classList.add('success');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
            } else {
                const errText = await response.text();
                let errMsg = errText;
                try {
                    errMsg = JSON.parse(errText).message || errText;
                } catch (e) { }
                throw new Error('Login failed: ' + errMsg);
            }
        } catch (error) {
            msg.innerText = error.message;
            msg.classList.add('error');
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    });
</script>
{{ end }}
