{{ define "content" }}
<div class="auth-container">
    <div class="glass-panel">
        <h1 class="gradient-text">Join the Community</h1>
        <p class="subtitle">Create an account to start sharing.</p>

        <form id="signup-form">
            <div class="form-group">
                <label for="avatar_name">Username (Avatar Name)</label>
                <input type="text" id="avatar_name" name="avatar_name" required minlength="3" maxlength="24"
                    placeholder="CodeMaster99">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="refered_avatar_code">Referral Code</label>
                <input type="text" id="refered_avatar_code" name="refered_avatar_code" required
                    placeholder="REF-XXXX-YYYY">
                <small style="color: #94a3b8;">Required for registration.</small>
            </div>

            <!-- Hidden/Default fields -->
            <input type="hidden" name="country" value="US"> <!-- Default/GeoIP later -->

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="btn-text">Sign Up</span>
                <div class="loader" style="display:none;"></div>
            </button>
            <p id="form-message" class="message"></p>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login">Log in</a></p>
            <p style="margin-top: 0.5rem; font-size: 0.9rem;"><a href="/activate">Activate Account</a></p>
        </div>
    </div>
</div>

<!-- Styles moved to tailwind.css -->

<script>
    const API_URL = "{{ if hugo.IsServer }}http://localhost:8080{{ else }}{{ .Site.Params.apiUrl }}{{ end }}";

    class SignupController extends BaseController {
        constructor(apiUrl) {
            super(apiUrl);
            this.form = document.getElementById('signup-form');
            if (this.form) {
                this.form.addEventListener('submit', (e) => this.handleSignup(e));
            }
        }

        async handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('form-message');
            const loader = btn.querySelector('.loader');

            btn.disabled = true;
            if (loader) loader.style.display = 'block';
            msg.innerText = '';
            msg.className = 'message';

            try {
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // 🛡️ Encryption Check
                if (typeof CryptoUtils === 'undefined') {
                    throw new Error("Encryption library missing. Please refresh.");
                }

                // Construct Registration Payload
                const payload = {
                    profile: {
                        avatar_name: data.avatar_name,
                        role: "user",
                        verification: {
                            encrypted_email: await CryptoUtils.encrypt(data.email),
                            encrypted_pass: await CryptoUtils.encrypt(data.password)
                        }
                    },
                    refered_avatar_code: data.refered_avatar_code,
                    country: data.country || "US"
                };

                const res = await fetch(`${this.apiUrl}/new_user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    let errMsg = await res.text();
                    try { errMsg = JSON.parse(errMsg).message || errMsg; } catch (_) { }
                    throw new Error(errMsg || 'Signup failed');
                }

                msg.innerText = 'Account Created! Redirecting to verification...';
                msg.classList.add('success');
                window.toaster.show('Account Created!', 'success');

                const username = data.avatar_name;
                setTimeout(() => {
                    window.location.href = `/activate?username=${encodeURIComponent(username)}`;
                }, 1500);

            } catch (error) {
                msg.innerText = error.message;
                msg.classList.add('error');
                this.handleError(error, 'Signup Failed');
            } finally {
                btn.disabled = false;
                if (loader) loader.style.display = 'none';
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const app = new SignupController(API_URL);
    });
</script>
{{ end }}
