{{ define "content" }}
<div class="dashboard-container">
    <div class="glass-panel">
        <h1 class="gradient-text">Admin Dashboard</h1>
        <p class="subtitle">Secure Referral Management</p>

        <div class="admin-section">
            <h2>Generate Referral Codes</h2>
            <form id="generate-form">
                <div class="form-group">
                    <label for="target_user">Target Username (Avatar Name)</label>
                    <input type="text" id="target_user" name="target_user" required placeholder="User to receive codes">
                </div>
                <div class="form-group">
                    <label for="count">Quantity</label>
                    <input type="number" id="count" name="count" value="3" min="1" max="10">
                </div>
                <button type="submit" class="submit-btn">Generate Codes</button>
            </form>
            <div id="gen-result" class="result-box"></div>
        </div>

        <div class="admin-section">
            <h2>Enable Referral Code</h2>
            <form id="enable-form">
                <div class="form-group">
                    <label for="code">Referral Code to Enable/Extend</label>
                    <input type="text" id="code" name="code" required placeholder="REF-XXXX-YYYY">
                </div>
                <button type="submit" class="submit-btn secondary-btn">Enable Code</button>
            </form>
            <div id="enable-result" class="result-box"></div>
        </div>

        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
    </div>
</div>

<style>
    :root {
        --primary-color: #f472b6;
        /* Admin Pink */
        --secondary-color: #fb7185;
        --bg-color: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-color: #f8fafc;
        --input-bg: rgba(0, 0, 0, 0.2);
    }

    .dashboard-container {
        padding: 2rem;
        min-height: 80vh;
    }

    .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 3rem;
        max-width: 700px;
        margin: 0 auto;
    }

    .gradient-text {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2.5rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 2rem;
    }

    .admin-section {
        background: rgba(0, 0, 0, 0.2);
        padding: 1.5rem;
        border-radius: 12px;
        margin-bottom: 2rem;
        border: 1px solid var(--glass-border);
    }

    .admin-section h2 {
        margin-top: 0;
        color: #e2e8f0;
        font-size: 1.2rem;
        margin-bottom: 1rem;
    }

    .form-group {
        margin-bottom: 1rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        color: #cbd5e1;
    }

    input {
        width: 100%;
        padding: 10px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        color: #fff;
        border-radius: 8px;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .secondary-btn {
        filter: hue-rotate(45deg);
    }

    .result-box {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        display: none;
        word-break: break-all;
        font-family: monospace;
    }

    .back-link {
        display: block;
        text-align: center;
        color: #94a3b8;
        text-decoration: none;
        margin-top: 2rem;
    }

    .back-link:hover {
        color: #fff;
    }
</style>

<script>
    const API_URL = "{{ if hugo.IsServer }}http://localhost:8080{{ else }}{{ .Site.Params.apiUrl }}{{ end }}";

    async function handleForm(formId, url, resultId, successMsg) {
        document.getElementById(formId).addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultBox = document.getElementById(resultId);
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerText = 'Processing...';
            resultBox.style.display = 'none';

            const formData = new FormData(e.target);
            let data;

            // Handle different data structures needed
            if (formId === 'enable-form') {
                data = new URLSearchParams(formData);
                // For URLSearchParams over JSON to match specific bind needs if any
                // But Admin usually strictly JSON. Let's start with JSON for uniformity with dashboard
                // Re-evaluating previous logic: referals.go binding.
                // Let's stick to what we decided: JSON.
                data = JSON.stringify(Object.fromEntries(formData.entries()));
                data = JSON.parse(data);
            } else {
                // GenerateReferrals uses a struct `Request`
                data = JSON.stringify(Object.fromEntries(formData.entries()));
                data = JSON.parse(data); // ensure numbers are correct types if needed?
                // count needs to be int.
                if (data.count) data.count = parseInt(data.count);
            }

            try {
                const headers = {};
                headers['Content-Type'] = 'application/json';
                const body = JSON.stringify(data);

                const response = await fetch(`${API_URL}${url}`, {
                    method: 'POST',
                    headers: headers,
                    credentials: 'include',
                    body: body
                });

                if (response.ok) {
                    const json = await response.json();
                    resultBox.innerText = successMsg + '\nResult: ' + JSON.stringify(json, null, 2);
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#4ade80';
                } else {
                    const txt = await response.text();
                    throw new Error(txt);
                }
            } catch (err) {
                resultBox.innerText = 'Error: ' + err.message;
                resultBox.style.display = 'block';
                resultBox.style.color = '#f87171';
            } finally {
                btn.disabled = false;
                btn.innerText = btn.getAttribute('original-text') || 'Submit';
            }
        });
    }

    // Capture original text
    document.querySelectorAll('button').forEach(b => b.setAttribute('original-text', b.innerText));

    handleForm('generate-form', '/generate_referrals', 'gen-result', 'Codes Generated!');
    handleForm('enable-form', '/enable_code', 'enable-result', 'Code Enabled!');
</script>
{{ end }}
