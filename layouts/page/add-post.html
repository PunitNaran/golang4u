{{ define "content" }}
<div class="max-w-3xl mx-auto py-10 px-4">
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold mb-2">Share a Post</h1>
        <p class="text-gray-500">Contribute to the Golang4u community.</p>
    </div>

    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700">

        <!-- Post Type Selector -->
        <div class="mb-6">
            <label class="block text-sm font-bold mb-2">Post Type</label>
            <div class="flex flex-wrap gap-2">
                <button type="button"
                    class="type-selector active px-4 py-2 rounded-lg bg-indigo-500 text-white font-bold transition-colors"
                    data-value="news">News</button>
                <button type="button"
                    class="type-selector px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                    data-value="learn">Learn</button>
                <button type="button"
                    class="type-selector px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                    data-value="events">Events</button>
                <button type="button"
                    class="type-selector px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                    data-value="jobs">Jobs</button>
            </div>
        </div>

        <form id="add-post-form" class="space-y-6">
            <input type="hidden" id="formType" name="formType" value="news">

            <!-- NEWS FIELDS -->
            <div id="fields-news" class="form-section">
                <div>
                    <label class="block text-sm font-medium mb-1">Title</label>
                    <input type="text" name="news-title"
                        class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Author</label>
                    <input type="text" name="news-author"
                        class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Cover Image</label>
                    <input type="file" name="news-cover"
                        class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Content (Rich Markdown)</label>
                    <textarea id="news-body" name="news-body" rows="10"
                        class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Tags (comma separated)</label>
                    <input type="text" name="news-tags" placeholder="go, tutorial, update"
                        class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Categories (comma separated)</label>
                    <input type="text" name="news-categories" placeholder="Technology, Release"
                        class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- Placeholder for other types (Simplified for MVP, expanding as needed) -->
            <div id="fields-learn" class="form-section hidden">
                <p class="text-yellow-500 text-sm italic">"Learn" fields are hidden for brevity in this template. Logic
                    remains same.</p>
                <!-- Add similar fields for Learn per struct -->
            </div>

            <!-- Submit -->
            <div class="pt-4 border-t border-gray-100 dark:border-gray-700">
                <div id="msg-container" class="mb-4 hidden p-3 rounded text-sm font-bold text-center"></div>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-transform transform active:scale-95 shadow-lg">
                    Publish Post
                </button>
        </form>
    </div>
</div>

<!-- Manually load add-post logic -->
<script src="/js/add-post.js"></script>
{{ end }}
