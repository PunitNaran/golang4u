{{ define "content" }}
<!-- added padding-top: 85px to clear the fixed header explicitly -->
<div class="h-screen flex flex-col" style="height: 100vh; padding-top: 85px;">

    <!-- Toolbar -->
    <div
        class="flex items-center justify-between px-4 py-2 bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-bold text-gray-700 dark:text-gray-200">Go Playground</h1>
            <span class="text-xs text-gray-500">Have fun!</span>
        </div>
        <div class="flex gap-2">
            <button id="run-btn"
                class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded text-sm font-bold transition-colors">
                <i class="fas fa-play"></i> Run
            </button>
            <button id="share-btn"
                class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-sm font-bold transition-colors">
                <i class="fas fa-share-alt"></i> Share
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed top-24 left-20 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-xl transform -translate-y-full opacity-0 transition-all duration-300 z-50 font-bold border border-gray-700 pointer-events-none hidden">
        <span id="toast-message"></span>
    </div>

    <!-- Main Content: stacked on mobile, side-by-side at md+ -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- Editor Panel: full width on mobile -->
        <div class="flex-1 w-full md:w-1/2 md:border-r border-gray-200 dark:border-gray-700 flex flex-col min-h-0">
            <div id="monaco-editor" class="flex-1 w-full h-full min-h-0"></div>
        </div>

        <!-- Output Panel: full width on mobile -->
        <div class="flex-1 w-full md:w-1/2 flex flex-col bg-gray-50 dark:bg-gray-900 min-h-0">
            <div class="px-4 py-2 bg-gray-200 dark:bg-black text-xs font-bold uppercase tracking-wider text-gray-500">
                Output</div>
            <pre id="output-console"
                class="flex-1 p-4 font-mono text-sm overflow-auto text-gray-800 dark:text-gray-300 whitespace-pre-wrap min-h-0"></pre>
        </div>

    </div>

</div>


<!-- Async Monaco Loader: Delays loading until after footer scripts (KaTeX/TypeIt) have run. -->
<!-- This prevents Monaco's AMD loader from breaking UMD scripts. -->
<script>
    console.log("[Playground] Inline script execution started.");
    window.GO4U_API_URL = "{{ if hugo.IsServer }}http://localhost:8080{{ else }}{{ .Site.Params.apiUrl }}{{ end }}";
    console.log("[Playground] API URL set to:", window.GO4U_API_URL);

    function initPlayground() {
        if (window.playgroundInitialized) {
            console.log("[Playground] Already initialized, skipping.");
            return;
        }
        window.playgroundInitialized = true;
        console.log("[Playground] Initializing...");

        var loaderScript = document.createElement('script');
        loaderScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js';
        loaderScript.async = true;

        loaderScript.onload = function () {
            console.log("[Playground] Monaco Loader ready. Loading logic...");
            var ps = document.createElement('script');
            // Use time hash to prevent caching during debug
            ps.src = '/js/playground.js?v=' + Date.now();
            document.body.appendChild(ps);
        };

        loaderScript.onerror = function (e) {
            console.error("[Playground] Failed to load Monaco loader", e);
            var out = document.getElementById('output-console');
            if (out) out.innerText = "Error: Failed to load Monaco Editor core.";
        };

        document.body.appendChild(loaderScript);
    }

    // Run immediately if ready, otherwise wait for load
    if (document.readyState === 'complete') {
        console.log("[Playground] Document already complete. Running init.");
        initPlayground();
    } else {
        window.addEventListener('load', function () {
            console.log("[Playground] Load event fired. Running init.");
            initPlayground();
        });
    }
</script>
{{ end }}
