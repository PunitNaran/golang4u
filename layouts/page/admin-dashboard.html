<script>
    (async function () {
        // 1. Fast Client-Side Check - REMOVED for Cross-Domain Compatibility
        // Cookies set by backend (Railway) are not visible to frontend (Netlify/Vercel) JS
        // We rely on the API call below to verify auth.

        // 2. Show Loading Overlay
        const overlay = document.createElement('div');
        overlay.id = 'auth-overlay';
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = '#0f172a';
        overlay.style.zIndex = '9999';
        overlay.style.display = 'flex';
        overlay.style.justifyContent = 'center';
        overlay.style.alignItems = 'center';
        overlay.innerHTML = '<h1 style="color:white; font-family:sans-serif;">Verifying Permissions...</h1>';
        document.body.appendChild(overlay);

        // 3. Verify Role with Backend
        try {
            // Check if we are in dev or prod to get correct API URL
            // Re-using the logic from the bottom of the file would be cleaner, but we need this to run BEFORE content renders
            // So we'll duplicate the simple check or just use relative path if on same domain, 
            // but since frontend/backend are on different ports in dev (1313 vs 8080), we need the full URL.
            const API_URL = window.GO4U_API_URL;

            const res = await fetch(`${API_URL}/profile/me`, { credentials: 'include' });
            if (!res.ok) throw new Error('Auth failed');

            const user = await res.json();
            if (user.role !== 'admin') {
                alert("Access Denied: Admins only.");
                window.location.href = "/"; // Redirect to home
            } else {
                // Success - remove overlay
                document.body.removeChild(overlay);
            }
        } catch (e) {
            console.error("Auth Error:", e);
            window.location.href = "/login";
        }
    })();
</script>

<script>
    // --- 🧱 DASHBOARD CONTROLLER ---
    class DashboardController extends BaseController {
        constructor(apiUrl) {
            super(apiUrl);
            this.init();
        }

        async init() {
            // Setup Forms
            this.setupForm('generate-form', '/generate_referrals', 'gen-result', 'Codes Generated!');
            this.setupForm('enable-form', '/enable_code', 'enable-result', 'Code Enabled!');
            this.setupRemoveReferralForm();
            this.setupResetPasswordForm();

            // Initial Data Load
            this.fetchPendingPosts();
        }

        setupRemoveReferralForm() {
            const form = document.getElementById('remove-ref-form');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const resultBox = document.getElementById('remove-ref-result');
                const originalText = btn.innerText;
                btn.disabled = true; btn.innerText = 'Processing...';
                resultBox.style.display = 'none';
                try {
                    const fd = new FormData(e.target);
                    const data = {
                        avatar_name: fd.get('rr_user'),
                        code: fd.get('rr_code'),
                    };
                    const csrfM = document.cookie.match(/csrf_token=([^;]+)/);
                    const res = await fetch(`${this.apiUrl}/admin/users/remove-referral`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(csrfM ? { 'X-CSRF-Token': csrfM[1] } : {}),
                        },
                        credentials: 'include',
                        body: JSON.stringify(data),
                    });
                    if (!res.ok) throw new Error(await res.text());
                    const json = await res.json();
                    resultBox.innerText = `Code removed. Remaining: ${JSON.stringify(json)}`;
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#4ade80';
                    window.toaster.show('Code removed', 'success');
                    form.reset();
                } catch (err) {
                    resultBox.innerText = `Error: ${err.message}`;
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#f87171';
                    window.toaster.show('Operation failed', 'error');
                } finally {
                    btn.disabled = false; btn.innerText = originalText;
                }
            });
        }

        setupResetPasswordForm() {
            const form = document.getElementById('reset-pw-form');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const resultBox = document.getElementById('reset-pw-result');
                const originalText = btn.innerText;
                btn.disabled = true; btn.innerText = 'Encrypting...';
                resultBox.style.display = 'none';
                try {
                    const fd = new FormData(e.target);
                    // Encrypt the new password with the server's P-256 key so it
                    // never crosses the wire (or the admin's logs) in plaintext.
                    const encrypted = await CryptoUtils.encrypt(fd.get('rp_pass'));
                    const data = {
                        avatar_name: fd.get('rp_user'),
                        new_password: encrypted,
                    };
                    const csrfM = document.cookie.match(/csrf_token=([^;]+)/);
                    const res = await fetch(`${this.apiUrl}/admin/users/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(csrfM ? { 'X-CSRF-Token': csrfM[1] } : {}),
                        },
                        credentials: 'include',
                        body: JSON.stringify(data),
                    });
                    if (!res.ok) throw new Error(await res.text());
                    const json = await res.json();
                    resultBox.innerText = `Password reset: ${JSON.stringify(json)}`;
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#4ade80';
                    window.toaster.show('Password reset', 'success');
                    form.reset();
                } catch (err) {
                    resultBox.innerText = `Error: ${err.message}`;
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#f87171';
                    window.toaster.show('Operation failed', 'error');
                } finally {
                    btn.disabled = false; btn.innerText = originalText;
                }
            });
        }

        setupForm(formId, endpoint, resultId, successMsg) {
            const form = document.getElementById(formId);
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const resultBox = document.getElementById(resultId);
                const originalText = btn.innerText;

                // UI Loading State
                btn.disabled = true;
                btn.innerText = 'Processing...';
                resultBox.style.display = 'none';

                try {
                    const formData = new FormData(e.target);
                    let data;

                    // Data normalization
                    if (formId === 'generate-form') {
                        data = Object.fromEntries(formData.entries());
                        if (data.count) data.count = parseInt(data.count);
                    } else {
                        data = Object.fromEntries(formData.entries());
                    }

                    const csrfM = document.cookie.match(/csrf_token=([^;]+)/);
                    const res = await fetch(`${this.apiUrl}${endpoint}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(csrfM ? { 'X-CSRF-Token': csrfM[1] } : {}),
                        },
                        credentials: 'include',
                        body: JSON.stringify(data)
                    });

                    if (!res.ok) throw new Error(await res.text());

                    const json = await res.json();
                    resultBox.innerText = `${successMsg}\nResult: ${JSON.stringify(json, null, 2)}`;
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#4ade80';
                    window.toaster.show(successMsg, 'success');
                    form.reset();
                } catch (err) {
                    resultBox.innerText = `Error: ${err.message}`;
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#f87171';
                    window.toaster.show('Operation failed', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            });
        }

        async fetchPendingPosts() {
            const container = document.getElementById('pending-posts-container');

            // 🧱 Prevent Race Conditions: Abort previous request if running
            // BaseController handles this via fetchSafe if we passed a key,
            // but here we are manually managing DOM so we'll just use fetchSafe for the data.

            try {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Loading pending posts...</p>';

                const posts = await this.fetchSafe('pending-posts', '/admin/posts/pending');

                if (posts === null) return; // Aborted

                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8;">No pending posts.</p>';
                    return;
                }

                // 🚀 Performance: Use DocumentFragment for batch DOM update
                const fragment = document.createDocumentFragment();

                posts.forEach(post => {
                    const card = this.createPostCard(post);
                    fragment.appendChild(card);
                });

                container.innerHTML = '';
                container.appendChild(fragment);

            } catch (e) {
                container.innerHTML = `<p style="text-align:center; color:#f87171;">Error: ${e.message}</p>`;
                const retryBtn = Utils.el('button', ['submit-btn'], 'Retry');
                retryBtn.style.maxWidth = '200px';
                retryBtn.style.margin = '1rem auto';
                retryBtn.style.display = 'block';
                retryBtn.onclick = () => this.fetchPendingPosts();
                container.appendChild(retryBtn);
            }
        }

        createPostCard(post) {
            const card = Utils.el('div', ['post-card']);

            // Left Info
            const infoDiv = Utils.el('div', ['post-info']);

            const h3 = Utils.el('h3', [], `${post.title} `);
            const badge = Utils.el('span', ['badge'], post.type);
            h3.appendChild(badge);

            const pAuthor = Utils.el('p', ['author'], `By ${post.author} • ${new Date(post.createdAt).toLocaleDateString()}`);

            infoDiv.appendChild(h3);
            infoDiv.appendChild(pAuthor);

            // Cover Link (Sanitized)
            if (post.cover || post.featuredImage) {
                const rawUrl = post.cover || post.featuredImage;
                const safeUrl = Utils.sanitizeUrl(rawUrl);

                if (safeUrl) {
                    const actionsDiv = Utils.el('div', ['actions']);
                    const a = Utils.el('a', ['preview-link'], 'View Cover');
                    a.href = safeUrl;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer'; // 🛡️ Security: Prevent tabnabbing
                    actionsDiv.appendChild(a);
                    infoDiv.appendChild(actionsDiv);
                }
            }

            card.appendChild(infoDiv);

            // Right Buttons
            const btnDiv = Utils.el('div', ['mod-buttons']);

            const approveBtn = Utils.el('button', ['btn-approve'], 'Approve');
            approveBtn.onclick = () => this.updateStatus(post.id, 'approved');

            const rejectBtn = Utils.el('button', ['btn-reject'], 'Reject');
            rejectBtn.onclick = () => this.updateStatus(post.id, 'rejected');

            btnDiv.appendChild(approveBtn);
            btnDiv.appendChild(rejectBtn);
            card.appendChild(btnDiv);

            return card;
        }

        async updateStatus(id, status) {
            // Basic confirm is okay here, but could be replaced with custom modal
            if (!confirm(`Mark this post as ${status}?`)) return;

            try {
                const csrfM = document.cookie.match(/csrf_token=([^;]+)/);
                const res = await fetch(`${this.apiUrl}/admin/posts/status`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrfM ? { 'X-CSRF-Token': csrfM[1] } : {}),
                    },
                    credentials: 'include',
                    body: JSON.stringify({ id, status })
                });

                if (res.ok) {
                    window.toaster.show(`Post ${status} successfully`, 'success');
                    this.fetchPendingPosts(); // Refresh list
                } else {
                    throw new Error("Failed to update");
                }
            } catch (e) {
                window.toaster.show(e.message, 'error');
            }
        }
    }

    // Initialize
    const API_URL = window.GO4U_API_URL;
    const app = new DashboardController(API_URL);

</script>
