<script>
    (async function () {
        // 1. Fast Client-Side Check
        if (!document.cookie.split(';').some((c) => c.trim().startsWith('logged_in='))) {
            window.location.href = "/login";
            return;
        }

        // 2. Show Loading Overlay
        const overlay = document.createElement('div');
        overlay.id = 'auth-overlay';
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = '#0f172a';
        overlay.style.zIndex = '9999';
        overlay.style.display = 'flex';
        overlay.style.justifyContent = 'center';
        overlay.style.alignItems = 'center';
        overlay.innerHTML = '<h1 style="color:white; font-family:sans-serif;">Verifying Permissions...</h1>';
        document.body.appendChild(overlay);

        // 3. Verify Role with Backend
        try {
            // Check if we are in dev or prod to get correct API URL
            // Re-using the logic from the bottom of the file would be cleaner, but we need this to run BEFORE content renders
            // So we'll duplicate the simple check or just use relative path if on same domain, 
            // but since frontend/backend are on different ports in dev (1313 vs 8080), we need the full URL.
            // We'll peek at the template var:
            const API_URL = "{{ if hugo.IsServer }}http://localhost:8080{{ else }}{{ .Site.Params.apiUrl }}{{ end }}";

            const res = await fetch(`${API_URL}/profile`, { credentials: 'include' });
            if (!res.ok) throw new Error('Auth failed');

            const user = await res.json();
            if (user.role !== 'admin') {
                alert("Access Denied: Admins only.");
                window.location.href = "/"; // Redirect to home
            } else {
                // Success - remove overlay
                document.body.removeChild(overlay);
            }
        } catch (e) {
            console.error("Auth Error:", e);
            window.location.href = "/login";
        }
    })();
</script>

<script>
    const API_URL = "{{ if hugo.IsServer }}http://localhost:8080{{ else }}{{ .Site.Params.apiUrl }}{{ end }}";

    async function handleForm(formId, url, resultId, successMsg) {
        document.getElementById(formId).addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultBox = document.getElementById(resultId);
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerText = 'Processing...';
            resultBox.style.display = 'none';

            const formData = new FormData(e.target);
            let data;

            // Handle different data structures needed
            if (formId === 'enable-form') {
                data = new URLSearchParams(formData);
                // For URLSearchParams over JSON to match specific bind needs if any
                // But Admin usually strictly JSON. Let's start with JSON for uniformity with dashboard
                // Re-evaluating previous logic: referals.go binding.
                // Let's stick to what we decided: JSON.
                data = JSON.stringify(Object.fromEntries(formData.entries()));
                data = JSON.parse(data);
            } else {
                // GenerateReferrals uses a struct `Request`
                data = JSON.stringify(Object.fromEntries(formData.entries()));
                data = JSON.parse(data); // ensure numbers are correct types if needed?
                // count needs to be int.
                if (data.count) data.count = parseInt(data.count);
            }

            try {
                const headers = {};
                headers['Content-Type'] = 'application/json';
                const body = JSON.stringify(data);

                const response = await fetch(`${API_URL}${url}`, {
                    method: 'POST',
                    headers: headers,
                    credentials: 'include',
                    body: body
                });

                if (response.ok) {
                    const json = await response.json();
                    resultBox.innerText = successMsg + '\nResult: ' + JSON.stringify(json, null, 2);
                    resultBox.style.display = 'block';
                    resultBox.style.color = '#4ade80';
                } else {
                    const txt = await response.text();
                    throw new Error(txt);
                }
            } catch (err) {
                resultBox.innerText = 'Error: ' + err.message;
                resultBox.style.display = 'block';
                resultBox.style.color = '#f87171';
            } finally {
                btn.disabled = false;
                btn.innerText = btn.getAttribute('original-text') || 'Submit';
            }
        });
    }

    // Capture original text
    document.querySelectorAll('button').forEach(b => b.setAttribute('original-text', b.innerText));

    handleForm('generate-form', '/generate_referrals', 'gen-result', 'Codes Generated!');
    handleForm('enable-form', '/enable_code', 'enable-result', 'Code Enabled!');

    // --- Moderation Logic ---
    async function fetchPendingPosts() {
        const container = document.getElementById('pending-posts-container');
        try {
            const res = await fetch(`${API_URL}/admin-panel/posts/pending`, { credentials: 'include' });
            if (!res.ok) throw new Error("Failed to load");
            const posts = await res.json();

            if (!posts || posts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">No pending posts.</p>';
                return;
            }

            container.innerHTML = '';
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';

                // Post Info
                const infoDiv = document.createElement('div');
                infoDiv.className = 'post-info';

                const h3 = document.createElement('h3');
                h3.textContent = post.title + ' ';
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = post.type;
                h3.appendChild(badge);
                infoDiv.appendChild(h3);

                const pAuthor = document.createElement('p');
                pAuthor.className = 'author';
                pAuthor.textContent = `By ${post.author} • ${new Date(post.createdAt).toLocaleDateString()}`;
                infoDiv.appendChild(pAuthor);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';
                if (post.cover || post.featuredImage) {
                    const a = document.createElement('a');
                    a.href = post.cover || post.featuredImage;
                    a.target = '_blank';
                    a.className = 'preview-link';
                    a.textContent = 'View Cover';
                    actionsDiv.appendChild(a);
                }
                infoDiv.appendChild(actionsDiv);
                card.appendChild(infoDiv);

                // Buttons
                const btnDiv = document.createElement('div');
                btnDiv.className = 'mod-buttons';

                const approveBtn = document.createElement('button');
                approveBtn.className = 'btn-approve';
                approveBtn.textContent = 'Approve';
                approveBtn.onclick = () => window.updateStatus(post.id, 'approved');
                btnDiv.appendChild(approveBtn);

                const rejectBtn = document.createElement('button');
                rejectBtn.className = 'btn-reject';
                rejectBtn.textContent = 'Reject';
                rejectBtn.onclick = () => window.updateStatus(post.id, 'rejected');
                btnDiv.appendChild(rejectBtn);

                card.appendChild(btnDiv);
                container.appendChild(card);
            });

        } catch (e) {
            container.innerHTML = '<p style="text-align:center; color:#f87171;">Error loading posts.</p>';
        }
    }

    window.updateStatus = async function (id, status) {
        if (!confirm(`Mark this post as ${status}?`)) return;
        try {
            const res = await fetch(`${API_URL}/admin-panel/posts/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ id, status })
            });
            if (res.ok) {
                fetchPendingPosts(); // Refresh list
            } else {
                alert("Failed to update status");
            }
        } catch (e) {
            alert("Error: " + e.message);
        }
    };

    // Initial Load
    fetchPendingPosts();

</script>
