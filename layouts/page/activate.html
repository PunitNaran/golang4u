{{ define "content" }}
<div class="auth-container">
    <div class="glass-panel">
        <h1 class="gradient-text">Activate Account</h1>
        <p class="subtitle">Enter the code sent to your email.</p>

        <form id="activate-form">
            <input type="hidden" name="activation_type" value="email">

            <div class="form-group">
                <label for="user_key">Username (Avatar Name)</label>
                <input type="text" id="user_key" name="user_key" required placeholder="CodeMaster99">
            </div>

            <div class="form-group">
                <label for="activation_code">Activation Code</label>
                <input type="text" id="activation_code" name="activation_code" required placeholder="123456"
                    autocomplete="off">
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="btn-text">Verify & Activate</span>
                <div class="loader" style="display:none;"></div>
            </button>
            <p id="form-message" class="message"></p>
        </form>

        <div class="auth-footer">
            <p>Did not receive code? <a href="#" id="resend-link">Resend</a></p>
        </div>
    </div>
</div>

<!-- Styles moved to tailwind.css -->

<script>
    const API_URL = window.GO4U_API_URL;

    document.addEventListener('DOMContentLoaded', () => {
        // Check query params for username pre-fill
        const urlParams = new URLSearchParams(window.location.search);
        const usernameParam = urlParams.get('username') || urlParams.get('user_key');
        if (usernameParam && document.getElementById('user_key')) {
            document.getElementById('user_key').value = usernameParam;
        }

        const activateForm = document.getElementById('activate-form');
        if (activateForm) {
            activateForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submit-btn');
                const msg = document.getElementById('form-message');
                const loader = btn.querySelector('.loader');
                const inputs = activateForm.querySelectorAll('input');

                // Reset validation states
                inputs.forEach(input => input.classList.remove('input-error'));

                btn.disabled = true;
                loader.style.display = 'block';
                msg.innerText = '';
                msg.className = 'message';

                const formData = new FormData(e.target);
                const data = {
                    user_key: formData.get('user_key'),
                    activation_code: formData.get('activation_code'),
                    activation_type: 'email'
                };

                try {
                    const response = await fetch(`${API_URL}/activate_user`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        const qrBytes = await response.json();

                        if (qrBytes) {
                            // Display 2FA QR Code
                            msg.innerText = 'Activation Successful! Scan the QR Code below for 2FA.';
                            msg.classList.add('success');

                            // Create/Show Image
                            let img = document.getElementById('qr-code-img');
                            if (!img) {
                                const imgContainer = document.createElement('div');
                                imgContainer.style.marginTop = '20px';
                                imgContainer.style.textAlign = 'center';
                                img = document.createElement('img');
                                img.id = 'qr-code-img';
                                img.style.borderRadius = '12px';
                                img.style.border = '4px solid white';
                                imgContainer.appendChild(img);
                                document.querySelector('.auth-footer').before(imgContainer);
                            }
                            img.src = "data:image/png;base64," + qrBytes;

                            // Change button to "Continue to Login"
                            btn.querySelector('.btn-text').innerText = "Continue to Login";
                            btn.disabled = false;
                            loader.style.display = 'none';

                            // Remove old listener effectively by cloning
                            const oldForm = document.getElementById('activate-form');
                            const newFormClone = oldForm.cloneNode(true);
                            oldForm.parentNode.replaceChild(newFormClone, oldForm);

                            newFormClone.addEventListener('submit', (ev) => {
                                ev.preventDefault();
                                window.location.href = '/login';
                            });

                        } else {
                            msg.innerText = 'Account Activated! Redirecting to login...';
                            msg.classList.add('success');
                            setTimeout(() => {
                                window.location.href = '/login';
                            }, 2000);
                        }

                    } else {
                        const errText = await response.text();
                        let errMsg = errText;
                        try {
                            errMsg = JSON.parse(errText).message || errText;
                        } catch (e) { }
                        throw new Error('Activation failed: ' + errMsg);
                    }
                } catch (error) {
                    inputs.forEach(input => {
                        input.classList.remove('input-error');
                        void input.offsetWidth;
                        input.classList.add('input-error');
                    });

                    msg.innerText = error.message;
                    msg.classList.add('error');
                } finally {
                    btn.disabled = false;
                    loader.style.display = 'none';
                }
            });
        }

        const resendLink = document.getElementById('resend-link');
        if (resendLink) {
            resendLink.addEventListener('click', async (e) => {
                e.preventDefault();
                alert("Resend functionality coming soon!");
                // Logic to call /resend_verification if needed
            });
        }
    });
</script>
{{ end }}
