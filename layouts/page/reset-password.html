{{ define "content" }}
<div class="auth-container">
    <div class="glass-panel">
        <h1 class="gradient-text">Complete Password Reset</h1>
        <p class="subtitle">Enter the code from your email and your new password.</p>

        <form id="reset-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="code">Reset Code</label>
                <input type="text" id="code" name="code" required placeholder="abc123" maxlength="6">
            </div>

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="info-box">
                <p>⚠️ <strong>Important:</strong> Resetting your password will disable Two-Factor Authentication on your
                    account to prevent lockout. You can re-enable it in Settings after logging in.</p>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="btn-text">Reset Password</span>
                <div class="loader" style="display:none;"></div>
            </button>
            <p id="form-message" class="message"></p>
        </form>

        <div class="auth-footer">
            <p>Back to <a href="/login">Log in</a></p>
        </div>
    </div>
</div>

<style>
    :root {
        --primary-color: #6366f1;
        --secondary-color: #a855f7;
        --bg-color: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-color: #f8fafc;
        --input-bg: rgba(0, 0, 0, 0.2);
    }

    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 80px);
        padding: 2rem;
        margin-top: 100px;
    }

    .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 3rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .gradient-text {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2.5rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 2rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #e2e8f0;
    }

    input {
        width: 100%;
        padding: 12px 16px;
        background: var(--input-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        color: var(--text-color);
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .info-box {
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1.5rem;
    }

    .info-box p {
        margin: 0;
        color: #fbbf24;
        font-size: 0.9rem;
    }

    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        color: #94a3b8;
    }

    .auth-footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
    }

    .message {
        text-align: center;
        margin-top: 1rem;
        font-weight: 600;
    }

    .success {
        color: #4ade80;
    }

    .error {
        color: #f87171;
    }

    .loader {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 3px solid #fff;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        margin-left: 10px;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<script>
    const API_URL = window.GO4U_API_URL;

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const msg = document.getElementById('form-message');
        const loader = btn.querySelector('.loader');

        btn.disabled = true;
        loader.style.display = 'block';
        msg.innerText = '';
        msg.className = 'message';

        const formData = new FormData(e.target);
        const email = formData.get('email');
        const code = formData.get('code');
        const password = formData.get('password');

        try {
            // 🛡️ Encryption Check
            if (typeof CryptoUtils === 'undefined') {
                throw new Error("Encryption library missing. Please refresh.");
            }

            const encryptedPassword = await CryptoUtils.encrypt(password);

            const response = await fetch(`${API_URL}/auth/reset-password`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    code: code,
                    new_password_encrypted: encryptedPassword
                })
            });

            if (response.ok) {
                const data = await response.json();
                msg.innerText = data.message || 'Password reset successful! Redirecting to login...';
                msg.classList.add('success');

                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                const errText = await response.text();
                let errMsg = errText;
                try {
                    errMsg = JSON.parse(errText).message || errText;
                } catch (e) { }
                throw new Error(errMsg || "Reset failed");
            }
        } catch (error) {
            msg.innerText = error.message;
            msg.classList.add('error');
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    });
</script>
{{ end }}
