[build]
  publish = "public"
  command = "npm install && npm run build:css && hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.121.2"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "npm install && npm run build:css && hugo --gc --minify --buildFuture --buildDrafts"

[context.branch-deploy]
  command = "npm install && npm run build:css && hugo --gc --minify"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://golang4u.com https://api.github.com https://api.golang4u.com https://cdnjs.cloudflare.com;"

